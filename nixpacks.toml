[phases.build]
cmds = [
    'composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader'
]

[start]
cmd = 'php artisan config:clear && php artisan route:clear && php artisan view:clear && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force && php artisan db:seed --force && php artisan serve --host 0.0.0.0 --port ${PORT:-3000}'
